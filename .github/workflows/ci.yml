name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  check:
    name: Lint, analyse & test
    runs-on: ubuntu-latest

    # Overrides phpunit.xml's own sqlite <env> defaults (which stay in
    # place for local `php artisan test` — no MySQL required for that) —
    # ambient environment variables take precedence over phpunit.xml's
    # <env> declarations, so this is enough on its own, no separate
    # phpunit config file needed.
    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: terroir_bi_test
      DB_USERNAME: root
      DB_PASSWORD: ''

    # MySQL, not sqlite: this app runs MySQL in production, and a
    # driver-specific query (a date/month-format function, a collation
    # quirk) can pass on sqlite and fail — or silently misbehave — on the
    # engine that actually matters. See config/database.php's own comment
    # on utf8mb4_0900_ai_ci for one bug this service run already caught.
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          MYSQL_DATABASE: terroir_bi_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          # intl powers locale-aware money formatting; pdo_mysql backs the
          # test DB (pdo_sqlite/sqlite3 kept too — local dev's own default).
          extensions: intl, pdo_mysql, pdo_sqlite, sqlite3, mbstring, dom, curl, fileinfo
          coverage: none
          tools: composer:v2

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run checks (lint, stan, parallel tests)
        run: composer check
